<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="g1-10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7b2fff;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="bg-10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a15;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f0820;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow-10">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg-10)"/>
  <!-- Decorative circles -->
  <circle cx="900" cy="180" r="300" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.08"/>
  <circle cx="180" cy="900" r="250" fill="none" stroke="#7b2fff" stroke-width="1" opacity="0.08"/>
  <!-- Accent corner bar -->
  <rect x="0" y="0" width="8" height="1080" fill="url(#g1-10)"/>
  <rect x="0" y="1072" width="1080" height="8" fill="url(#g1-10)"/>
  <!-- Brand label top -->
  <text x="60" y="72" font-family="'Arial Black', Arial, sans-serif" font-size="32" font-weight="900" fill="#00d4ff" letter-spacing="6">ALMA DIGITAL</text>
  <!-- Main emoji -->
  <text x="540" y="360" font-family="Apple Color Emoji, Segoe UI Emoji, sans-serif" font-size="200" text-anchor="middle" dominant-baseline="middle">🌐</text>
  
  <!-- Main title -->
  <text x="540" y="580" font-family="'Arial Black', Arial, sans-serif" font-size="68" font-weight="900" text-anchor="middle" fill="#ffffff">Free Domain Included</text>
  <!-- Subtitle -->
  <text x="540" y="660" font-family="Arial, sans-serif" font-size="42" font-weight="400" text-anchor="middle" fill="#8892a4">On every plan, always free</text>
  <!-- Bottom CTA bar -->
  <rect x="60" y="960" width="960" height="70" rx="12" fill="url(#g1-10)" opacity="0.15"/>
  <text x="540" y="1002" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#00d4ff">almadigitalservices.com</text>
</svg>